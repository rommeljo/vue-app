<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Register</title>
  <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="bg-gray-100 flex items-center justify-center h-screen">
  <div id="app" class="bg-white p-6 rounded shadow w-96">
    <h1 class="text-2xl font-bold mb-4">📝 Register</h1>

    <form @submit.prevent="registerUser" class="space-y-4">
      <div>
        <label class="block font-semibold">Name</label>
        <input type="text" v-model="user.name" class="w-full border px-3 py-2 rounded" required>
      </div>

      <div>
        <label class="block font-semibold">Email</label>
        <input type="email" v-model="user.email" class="w-full border px-3 py-2 rounded" required>
      </div>

      <div>
        <label class="block font-semibold">Password</label>
        <input type="password" v-model="user.password" class="w-full border px-3 py-2 rounded" required>
      </div>

      <div>
        <label class="block font-semibold">Phone</label>
        <input type="text" v-model="user.phone" class="w-full border px-3 py-2 rounded">
      </div>

      <button type="submit" class="bg-blue-600 text-white px-4 py-2 rounded w-full hover:bg-blue-700">
        Register
      </button>
    </form>

    <div v-if="message" class="text-green-600 mt-4">{{ message }}</div>
    <div v-if="error" class="text-red-600 mt-4">{{ error }}</div>
  </div>

  <script>
    const { createApp } = Vue;

    createApp({
      data() {
        return {
          user: { name: '', email: '', password: '', phone: '' },
          message: '',
          error: ''
        };
      },
      methods: {
        async registerUser() {
          try {
            const res = await axios.post("http://127.0.0.1:8000/register", this.user);

            // Save the token for future API calls
            localStorage.setItem("token", res.data.token);

            this.message = "Registration successful!";
            this.error = '';
            this.user = { name: '', email: '', password: '', phone: '' };

            // Redirect to protected page (like products.html)
            window.location.href = "products.html";
          } catch (err) {
            this.error = err.response?.data?.detail || "Registration failed";
            this.message = '';
          }
        }
      }
    }).mount("#app");
  </script>
</body>
</html>
