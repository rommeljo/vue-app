<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sales Management</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>

  <style>
    body {
      background-color: #f5f7fa;
      font-family: 'Poppins', sans-serif;
      margin: 0;
    }

    .navbar {
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    .hero {
      background: linear-gradient(135deg, #0d6efd, #0dcaf0);
      color: white;
      text-align: center;
      padding: 60px 20px;
      border-radius: 0 0 20px 20px;
      margin-bottom: 30px;
    }

    .hero h1 {
      font-weight: 700;
      font-size: 2rem;
    }

    .hero p {
      font-size: 1rem;
      opacity: 0.9;
    }

    .card {
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
      margin-bottom: 20px;
    }

    table {
      border-collapse: separate;
      border-spacing: 0;
      border-radius: 12px;
      overflow: hidden;
      width: 100%;
      background-color: white;
    }

    table thead {
      background-color: #0d6efd;
      color: white;
    }

    table th, table td {
      padding: 12px 15px;
      text-align: left;
    }

    table tbody tr:nth-child(even) {
      background-color: #f2f7ff;
    }

    select.form-select:focus,
    input.form-control:focus {
      border-color: #0d6efd;
      box-shadow: 0 0 0 1px #0d6efd;
    }

    button:focus {
      outline: none;
    }

    [v-cloak] { display: none; }
  </style>
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container-fluid">
      <a class="navbar-brand" href="/">My Shop</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="/products.html">Products</a></li>
          
        </ul>
      </div>
    </div>
  </nav>

  <!-- Hero Section -->
  <div class="hero">
    <h1>🧾 Sales Manager</h1>
    <p>Add, track, and manage all sales in one place.</p>
  </div>

  <div id="app" class="container my-4" v-cloak>

    <!-- Add Sale Form -->
    <div class="card p-4">
      <h5 class="mb-3">Add New Sale</h5>
      <form @submit.prevent="addSale">
        <div class="mb-3">
          <label class="form-label">Product</label>
          <select v-model="newSale.product_id" class="form-select" required>
            <option disabled value="">-- Select Product --</option>
            <option v-for="p in products" :key="p.id" :value="p.id">
              {{ p.productname }} (Stock: {{ p.stockquantity }})
            </option>
          </select>
        </div>
        <div class="mb-3">
          <label class="form-label">Quantity</label>
          <input type="number" v-model="newSale.quantity" class="form-control" required>
        </div>
        <button class="btn btn-primary">Add Sale</button>

        <div v-if="message" class="text-success mt-2">{{ message }}</div>
        <div v-if="error" class="text-danger mt-2">{{ error }}</div>
      </form>
    </div>

    <!-- Sales Table -->
    <div class="card p-4">
      <h5 class="mb-3">All Sales</h5>
      <table>
        <thead>
          <tr>
            <th>ID</th>
            <th>Product</th>
            <th>Quantity</th>
            <th>Sale Date</th>
          </tr>
        </thead>
        <tbody>
          <tr v-for="s in sales" :key="s.id">
            <td>{{ s.id }}</td>
            <td>{{ s.productname }}</td>
            <td>{{ s.quantity }}</td>
            <td>{{ s.sale_date }}</td>
          </tr>
        </tbody>
      </table>
    </div>

  </div>







  <script>
    const { createApp } = Vue;

    createApp({
      data() {
        return {
          url: "https://api.mydukashop.co.ke",
          sales: [],
          products: [],
          newSale: { product_id: '', quantity: '' },
          token: localStorage.getItem("token") || "" // Get JWT token from localStorage
        }
      },
      methods: {
        async fetchSales() {
          try {
            const res = await axios.get(this.url +'/sales', {
              headers: { Authorization: `Bearer ${this.token}` }
            });
            this.sales = res.data;
          } catch (err) {
            alert(err.response?.data?.detail || "Failed to fetch sales");
          }
        },
        async fetchProducts() {
          try {
            const res = await axios.get(this.url +'/products', {
              headers: { Authorization: `Bearer ${this.token}` }
            });
            this.products = res.data;
          } catch (err) {
            alert(err.response?.data?.detail || "Failed to fetch products");
          }
        },
        async addSale() {
          try {
            const res = await axios.post(this.url +'/sales', this.newSale, {
              headers: { Authorization: `Bearer ${this.token}` }
            });

            this.newSale = { product_id: '', quantity: '' };
            this.fetchSales();
            this.fetchProducts();
          } catch (err) {
            alert(err.response?.data?.detail || "Failed to add sale");
          }
        }
      },
      mounted() {
        if (!this.token) {
          alert("No token found. Please login first.");
          window.location.href = "login.html"; // Redirect if no token
        } else {
          this.fetchSales();
          this.fetchProducts();
        }
      }
    }).mount('#app');
  </script>
</body>
</html>
