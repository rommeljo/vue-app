<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sales Management</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
</head>
<body class="p-4">
  <div id="app" class="container">
    <h1 class="mb-4">🧾 Sales Management</h1>

    <!-- Add Sale Form -->
    <div class="card p-3 mb-4 shadow-sm">
      <h5>Add New Sale</h5>
      <form @submit.prevent="addSale">
        <div class="mb-3">
          <label for="product" class="form-label">Product</label>
          <select v-model="newSale.product_id" class="form-select" required>
            <option disabled value="">-- Select Product --</option>
            <option v-for="p in products" :key="p.id" :value="p.id">
              {{ p.productname }} (Stock: {{ p.stockquantity }})
            </option>
          </select>
        </div>
        <div class="mb-3">
          <label for="quantity" class="form-label">Quantity</label>
          <input type="number" v-model="newSale.quantity" class="form-control" required>
        </div>
        <button class="btn btn-primary">Add Sale</button>
      </form>
    </div>

    <!-- Sales Table -->
    <div class="card p-3 shadow-sm">
      <h5>All Sales</h5>
      <table class="table table-bordered table-striped mt-3">
        <thead class="table-dark">
          <tr>
            <th>ID</th>
            <th>Product</th>
            <th>Quantity</th>
            <th>Sale Date</th>
          </tr>
        </thead>
        <tbody>
          <tr v-for="s in sales" :key="s.id">
            <td>{{ s.id }}</td>
            <td>{{ s.productname }}</td>
            <td>{{ s.quantity }}</td>
            <td>{{ s.sale_date }}</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <script>
    const { createApp } = Vue;

    createApp({
      data() {
        return {
          sales: [],
          products: [],
          newSale: { product_id: '', quantity: '' }
        }
      },
      methods: {
        async fetchSales() {
          const res = await axios.get('http://127.0.0.1:5000/sales');
          this.sales = res.data;
        },
        async fetchProducts() {
          const res = await axios.get('http://127.0.0.1:5000/products');
          this.products = res.data;
        },
       async addSale() {
  try {
    let res = await axios.post('http://127.0.0.1:5000/sales', this.newSale);
    let sale = res.data;

    // Ask for phone number to pay
    let phone = prompt("Enter M-Pesa number to pay:");
    if (phone) {
      await axios.post('http://127.0.0.1:5000/mpesa/stkpush', {
        phone: phone,
        sale_id: sale.id
      });
      alert("STK Push sent. Complete payment on your phone.");
    }

    this.newSale = { product_id: '', quantity: '' };
    this.fetchSales();
    this.fetchProducts();
  } catch (err) {
    alert(err.response?.data?.error || "Error adding sale");
  }
}
      },

    

      mounted() {
        this.fetchSales();
        this.fetchProducts();
      }
    }).mount('#app');
  </script>
</body>
</html>
