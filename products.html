<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Products Manager</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background-color: #f5f7fa;
      font-family: 'Poppins', sans-serif;
    }
    .navbar {
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
    }
    .hero-section {
      background: linear-gradient(135deg, #0d6efd, #0dcaf0);
      color: white;
      padding: 40px 20px;
      border-radius: 0 0 20px 20px;
      text-align: center;
      margin-bottom: 30px;
    }
    .hero-section h1 { font-weight: 700; font-size: 2rem; }
    .hero-section p { font-size: 1rem; opacity: 0.9; }
    table { border-collapse: collapse; width: 100%; background-color: white; border-radius: 10px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
    th { background-color: #0d6efd; color: white; font-weight: 600; }
    th, td { padding: 12px 15px; text-align: left; }
    tr:nth-child(even) { background-color: #f2f7ff; }
    input:focus { outline: none; border-color: #0d6efd; box-shadow: 0 0 0 1px #0d6efd; }
    button:focus { outline: none; }
    [v-cloak] { display: none; }
  </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
  <div class="container-fluid">
    <a class="navbar-brand" href="/">My Shop</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item"><a class="nav-link" href="/sales.html">Sales</a></li>
      </ul>
    </div>
  </div>
</nav>

<div class="hero-section max-w-3xl mx-auto">
  <h1>📦 Products Manager</h1>
  <p>Manage your products efficiently — add new items, set prices, and track stock.</p>
</div>

<div id="app" class="max-w-3xl mx-auto bg-white p-6 rounded shadow" v-cloak>

  <form @submit.prevent="submitProduct" class="space-y-4 mb-6">
    <div>
      <label class="block font-semibold mb-1">Product Name:</label>
      <input type="text" v-model="product.productname" class="w-full border rounded px-3 py-2" required />
    </div>
    <div>
      <label class="block font-semibold mb-1">Price:</label>
      <input type="number" v-model.number="product.productprice" step="0.01" class="w-full border rounded px-3 py-2" required />
    </div>
    <div>
      <label class="block font-semibold mb-1">Stock Quantity:</label>
      <input type="number" v-model.number="product.stockquantity" min="0" class="w-full border rounded px-3 py-2" required />
    </div>

    <button type="submit" class="bg-green-600 text-white px-4 py-2 rounded hover:bg-green-700 transition">
      Add Product
    </button>

    <div v-if="message" class="text-green-600 mt-2">{{ message }}</div>
    <div v-if="error" class="text-red-600 mt-2">{{ error }}</div>
  </form>

  <div v-if="products.length">
    <h2 class="text-xl font-semibold mb-2">📋 Product List</h2>
    <table>
      <thead>
        <tr>
          <th>ID</th>
          <th>Name</th>
          <th>Price</th>
          <th>Stock</th>
        </tr>
      </thead>
      <tbody>
        <tr v-for="p in products" :key="p.id">
          <td>{{ p.id }}</td>
          <td>{{ p.productname }}</td>
          <td>${{ p.productprice.toFixed(2) }}</td>
          <td>{{ p.stockquantity }}</td>
        </tr>
      </tbody>
    </table>
  </div>
</div>

<script>
const { createApp } = Vue;

createApp({
  data() {
    return {
      url: "http://api.mydukashop.co.ke",
      products: [],
      product: { productname: '', productprice: 0, stockquantity: 0 },
      message: '',
      error: ''
    };
  },
  methods: {
    fetchProducts() {
      const token = localStorage.getItem("token");
      axios.get(this.url + "/products", {
        headers: { Authorization: `Bearer ${token}` }
      })
      .then(res => { this.products = res.data; })
      .catch(() => { this.error = "Failed to load products."; });
    },
    submitProduct() {
      const token = localStorage.getItem("token");
      if (!token) { this.error = "You must be logged in to add products."; return; }

      axios.post(this.url + "/products", this.product, {
        headers: { Authorization: `Bearer ${token}` }
      })
      .then(() => {
        this.message = "Product added successfully.";
        this.error = '';
        this.product = { productname: '', productprice: 0, stockquantity: 0 };
        this.fetchProducts();
      })
      .catch(err => {
        this.error = err.response?.data?.detail || "Failed to add product.";
        this.message = '';
      });
    }
  },
  mounted() {
    this.fetchProducts();
  }
}).mount('#app');
</script>
</body>
</html>
