<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Login</title>
  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="bg-gray-100 flex items-center justify-center h-screen">
  <div id="app" class="bg-white p-6 rounded shadow w-96">
    <h1 class="text-2xl font-bold mb-4">🔑 Login</h1>

    <form @submit.prevent="loginUser" class="space-y-4">
      <div>
        <label class="block font-semibold">Email</label>
        <input type="email" v-model="credentials.email" class="w-full border px-3 py-2 rounded">
      </div>

      <div>
        <label class="block font-semibold">Password</label>
        <input type="password" v-model="credentials.password" class="w-full border px-3 py-2 rounded">
      </div>

      <button type="submit" class="bg-green-600 text-white px-4 py-2 rounded w-full hover:bg-green-700">
        Login
      </button>
    </form>

    <div v-if="error" class="text-red-600 mt-4">{{ error }}</div>
  </div>

  <script>
    const { createApp } = Vue;

    createApp({
      data() {
        return {
          credentials: { email: '', password: '' },
          error: ''
        };
      },
      methods: {
        loginUser() {
          axios.post("http://127.0.0.1:5000/login", this.credentials)
            .then(res => {
              // Save token + user info
              localStorage.setItem("token", res.data.token);
              localStorage.setItem("user", JSON.stringify(res.data.user));
              
              // Redirect to home.html
              window.location.href = "home.html";
            })
            .catch(err => {
              this.error = err.response?.data?.error || "Login failed";
            });
        }
      }
    }).mount("#app");
  </script>
</body>
</html>
