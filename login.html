<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Login</title>
  <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="bg-gray-100 flex items-center justify-center h-screen">
  <div id="app" class="bg-white p-6 rounded shadow w-96">
    <h1 class="text-2xl font-bold mb-4">🔐 Login</h1>

    <form @submit.prevent="loginUser" class="space-y-4">
      <div>
        <label class="block font-semibold">Email</label>
        <input type="email" v-model="email" class="w-full border px-3 py-2 rounded" required>
      </div>

      <div>
        <label class="block font-semibold">Password</label>
        <input type="password" v-model="password" class="w-full border px-3 py-2 rounded" required>
      </div>

      <button type="submit" class="bg-blue-600 text-white px-4 py-2 rounded w-full hover:bg-blue-700">
        Login
      </button>
    </form>

    <div v-if="message" class="text-green-600 mt-4">{{ message }}</div>
    <div v-if="error" class="text-red-600 mt-4">{{ error }}</div>
  </div>

  <script>
    const { createApp } = Vue;

    createApp({
      data() {
        return {
          email: '',
          password: '',
          message: '',
          error: ''
        };
      },
      methods: {
        async loginUser() {
          try {
            // OAuth2PasswordRequestForm expects form-encoded data (username + password)
            const form = new URLSearchParams();
            form.append("username", this.email);
            form.append("password", this.password);

            const res = await axios.post("http://127.0.0.1:8000/login", form, {
              headers: { "Content-Type": "application/x-www-form-urlencoded" }
            });

            // Save token to localStorage for later API requests
            localStorage.setItem("token", res.data.access_token);

            this.message = "Login successful!";
            this.error = '';

            // Example: redirect to products page after login
            window.location.href = "products.html";
          } catch (err) {
            this.error = err.response?.data?.detail || "Login failed.";
            this.message = '';
          }
        }
      }
    }).mount("#app");
  </script>
</body>
</html>
